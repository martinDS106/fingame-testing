services:
  mysql:
    image: mysql:8.4
    container_name: fin_game_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fin_game
      MYSQL_USER: fin_game
      MYSQL_PASSWORD: fin_game_pw
      MYSQL_ROOT_PASSWORD: root_pw
    ports:
      - "3307:3306"
    volumes:
      - fin_game_mysql_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

volumes:
  fin_game_mysql_data:

